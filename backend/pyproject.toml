[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends(...) in defaults is idiomatic, not a real bug

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated from a template we don't fully control the style of.
"alembic/*" = ["I001", "UP007", "UP035"]
# SQLAlchemy 2.0 Mapped[] relationships intentionally forward-reference sibling model
# classes as strings; ruff's static analysis can't see those imported under TYPE_CHECKING.
"app/models/*" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that need a live Postgres+PostGIS instance",
]
